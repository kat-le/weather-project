<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <div class="form-container">
          <div class="unit-toggle">
            <label>
                <input type="radio" name="unit" value="us" checked>
                °F
            </label>

            <label>
                <input type="radio" name="unit" value="metric">
                °C
            </label>
          </div>
          <form class="weather-form" id="weather-form">
            <input class="city-input" type="text" placeholder="Enter city, ZIP code, or address"></input>
            <button class="submit-btn" id="submit-btn" type="submit">Search</button>
          </form>
        </div>
        <div class="current-weather">
          <div class="curr-weather-card">
            <div class="alerts"></div>
            <div class="curr-weather-temp">
              <div class="temp">
                <h1 class="curr-temp"></h1>
                <p class="unit"></p>
              </div>
              <img class="weather-icon" alt="weather"></img>
              <p class="feelslike"></p>
            </div>
            <p class="location"></p>
            <p class="timezone"></p>
            <div class="wind-humidity">
              <p class="wind-speed"></p>
              <p class="humidity"></p>
            </div>
          </div>
          <div class="curr-info-section">
            <div class="sun">
              <p class="sunrise"></p>
              <p class="sunset"></p>
            </div>
            <div class="uv-index"></div>
          </div>
        </div>
      </div>
      <div class="right">
        <div class="hourly-card">
          <p class="desc"></p>
          <div class="hourly-container"></div>
        </div>
        <div class="forecast-card">
          <p>10 Day Forecast</p>
          <div class="forecast-container"></div>
        </div>
      </div>
    </div>
  </body>
</html>
